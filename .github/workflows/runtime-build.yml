name: Runtime build (no game assets)

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared runtime
        run: dotnet build tools/recompone-reference/RecompOne.Runtime/RecompOne.Runtime.csproj --configuration Release --nologo

  portable-launcher:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish launcher (standalone, no game content)
        shell: pwsh
        run: |
          dotnet publish tools/standalone-launcher/Vigilante8Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o dist/launcher
      - name: Upload launcher executable
        uses: actions/upload-artifact@v4
        with:
          name: Vigilante8Launcher-win-x64
          path: dist/launcher/Vigilante8Launcher.exe
          if-no-files-found: error
