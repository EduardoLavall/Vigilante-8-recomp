name: Runtime build (no game assets)

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared runtime
        run: dotnet build tools/recompone-reference/RecompOne.Runtime/RecompOne.Runtime.csproj --configuration Release --nologo
